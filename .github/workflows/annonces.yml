name: Annonces du jour

on:
  schedule:
    - cron: "0 6 * * *"   # 7 h à Paris en hiver, 8 h en été
  workflow_dispatch:
  push:                   # se lance aussi quand un script ou ce fichier change
    branches: [main]
    paths:
      - "scrapers/**"
      - ".github/workflows/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p data && rm -f data/journal.txt && touch data/journal.txt
      # "|| true" : si un site plante, les autres continuent
      - run: python scrapers/nestenn.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/orpi.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/swixim.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/iad.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/capifrance.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/proprietes_privees.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/century21.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/square_habitat.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/era.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/lesiteimmo.py 2>&1 | tee -a data/journal.txt || true
      - run: python scrapers/paruvendu.py 2>&1 | tee -a data/journal.txt || true
      # Ouvre les pages détaillées des annonces sans surface de terrain (mémorisé dans data/fiches.json)
      - run: python scrapers/fiches.py 2>&1 | tee -a data/journal.txt || true
      # Compare chaque annonce au prix du marché de l'Estimateur DVF (même algorithme, mêmes ventes)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scrapers/marche.js 2>&1 | tee -a data/journal.txt || true
      - name: Enregistrer les annonces
        run: |
          git config user.name "bot-annonces"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "Annonces du $(date +%F)" || echo "Rien de neuf"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
