<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Annonces">
<title>Annonces maison</title>
<style>
  :root { --fond: #f4f4f6; --carte: #fff; --texte: #1c1c1e; --gris: #6e6e73; --accent: #e8432e; --bord: #d1d1d6; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #000; --carte: #1c1c1e; --texte: #f2f2f7; --gris: #98989d; --bord: #3a3a3c; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--fond); color: var(--texte); }
  header { position: sticky; top: 0; z-index: 1; background: var(--carte); padding: 12px 16px; box-shadow: 0 1px 4px #0002; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .filtres { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filtres input, .filtres select { font-size: 16px; padding: 6px 8px; border: 1px solid var(--bord); border-radius: 8px; background: var(--carte); color: var(--texte); }
  .filtres input[type=number] { width: 120px; }
  #maj { color: var(--gris); font-size: 13px; margin-top: 6px; }
  main { padding: 4px 0 24px; }
  .carte { display: block; background: var(--carte); margin: 10px 16px; padding: 12px 14px; border-radius: 12px; color: inherit; text-decoration: none; }
  .prix { font-size: 20px; font-weight: 700; }
  .neuf { background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
  .titre { margin-top: 4px; font-size: 15px; }
  .details, .source { color: var(--gris); font-size: 14px; margin-top: 4px; }
  .vide { padding: 16px; color: var(--gris); }
</style>
</head>
<body>
<header>
  <h1>Annonces maison</h1>
  <div class="filtres">
    <input id="prixMax" type="number" inputmode="numeric" placeholder="Prix max €">
    <input id="chMin" type="number" inputmode="numeric" placeholder="Chambres min">
    <select id="source"><option value="">Toutes agences</option></select>
    <label><input id="neufs" type="checkbox"> Nouvelles</label>
  </div>
  <div id="maj">Chargement…</div>
</header>
<main id="liste"></main>
<script>
const champs = ["prixMax", "chMin", "source", "neufs"];
let annonces = [];

function lireFiltres() {
  try { return JSON.parse(localStorage.getItem("filtres") || "{}"); } catch { return {}; }
}
function ecrireFiltres(f) {
  try { localStorage.setItem("filtres", JSON.stringify(f)); } catch {}
}
function echapper(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function afficher() {
  const f = Object.fromEntries(champs.map(id => {
    const el = document.getElementById(id);
    return [id, el.type === "checkbox" ? el.checked : el.value];
  }));
  ecrireFiltres(f);
  const liste = annonces.filter(a =>
    (!f.prixMax || (a.prix && a.prix <= +f.prixMax)) &&
    (!f.chMin || (a.chambres && a.chambres >= +f.chMin)) &&
    (!f.source || a.source === f.source) &&
    (!f.neufs || a.nouveau));
  document.getElementById("liste").innerHTML = liste.map(a => {
    const details = [
      a.surface && a.surface + " m²", a.pieces && a.pieces + " pièces",
      a.chambres && a.chambres + " ch.", a.terrain && a.terrain.toLocaleString("fr-FR") + " m² terrain",
    ].filter(Boolean).join(" · ");
    return `<a class="carte" href="${echapper(a.lien)}" target="_blank" rel="noopener">
      <div class="prix">${a.prix ? a.prix.toLocaleString("fr-FR") + " €" : "Prix non lu"}${a.nouveau ? '<span class="neuf">Nouveau</span>' : ""}</div>
      <div class="titre">${echapper(a.titre)}</div>
      ${details ? `<div class="details">${details}</div>` : ""}
      <div class="source">${echapper(a.lieu)} · ${echapper(a.source)} · vu le ${echapper(a.vu_le)}</div>
    </a>`;
  }).join("") || '<p class="vide">Aucune annonce avec ces filtres.</p>';
}

fetch("data/annonces.json?" + Date.now()).then(r => r.json()).then(data => {
  annonces = data.annonces || [];
  const date = String(data.mis_a_jour).replace("T", " à ");
  document.getElementById("maj").textContent = `${annonces.length} annonces · mis à jour le ${date}`;
  const sel = document.getElementById("source");
  [...new Set(annonces.map(a => a.source))].sort().forEach(s => sel.add(new Option(s, s)));
  const f = lireFiltres();
  champs.forEach(id => {
    const el = document.getElementById(id);
    if (el.type === "checkbox") el.checked = !!f[id]; else el.value = f[id] || "";
    el.addEventListener("input", afficher);
  });
  afficher();
}).catch(() => {
  document.getElementById("maj").textContent = "Impossible de charger les annonces.";
});
</script>
</body>
</html>
