<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma maison">
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<title>Ma maison</title>
<style>
  :root {
    --fond: #f6f1ea; --carte: #fffdf9; --texte: #2a211b; --doux: #7a6c61; --trait: #e6ddd2;
    --accent: #c65a3a; --accent-doux: #f6e1d8; --vert: #4f7a5a; --ombre: 0 1px 2px rgba(60,40,20,.06), 0 6px 18px rgba(60,40,20,.07);
    --titre: "Fraunces", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #17130f; --carte: #221c17; --texte: #f3ebe2; --doux: #a8998c; --trait: #3a3029;
            --accent: #e27552; --accent-doux: #3d2a22; --vert: #7fb08b; --ombre: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* En-tête */
  .haut { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fond) 88%, transparent);
          backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
          padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--trait); }
  .ligne-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-family: var(--titre); font-size: 28px; margin: 0; letter-spacing: -.01em; }
  .barre { display: flex; gap: 8px; margin-top: 10px; }
  .commune { flex: 1; position: relative; }
  .commune select { width: 100%; appearance: none; -webkit-appearance: none; border: 1px solid var(--trait); background: var(--carte);
                    border-radius: 14px; padding: 11px 36px 11px 38px; font-weight: 600; box-shadow: var(--ombre); }
  .commune svg { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .commune .pin { left: 12px; color: var(--accent); }
  .commune .fleche { right: 12px; color: var(--doux); }
  .btn-filtres { position: relative; border: 1px solid var(--trait); background: var(--carte); border-radius: 14px; padding: 0 14px;
                 display: flex; align-items: center; gap: 6px; font-weight: 600; box-shadow: var(--ombre); }
  .pastille { background: var(--accent); color: #fff; font-size: 11.5px; min-width: 18px; height: 18px; border-radius: 9px; display: none;
              align-items: center; justify-content: center; padding: 0 5px; }
  .pastille.on { display: inline-flex; }
  .puces { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
  .puces::-webkit-scrollbar { display: none; }
  .puce { flex: none; border: 1px solid var(--trait); background: var(--carte); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .puce.on { background: var(--texte); color: var(--fond); border-color: var(--texte); }
  .puce.accent.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Bandeau de synchronisation */
  .synchro { margin: 12px 16px 0; background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; box-shadow: var(--ombre); overflow: hidden; }
  .synchro > button { width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left; }
  .point { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--vert); box-shadow: 0 0 0 4px color-mix(in srgb, var(--vert) 18%, transparent); }
  .synchro.alerte .point { background: #d99a2b; box-shadow: 0 0 0 4px rgba(217,154,43,.2); }
  .synchro.panne .point { background: #c8432e; box-shadow: 0 0 0 4px rgba(200,67,46,.2); }
  .synchro .txt { flex: 1; min-width: 0; }
  .synchro .l1 { font-weight: 600; font-size: 14.5px; }
  .synchro .l2 { color: var(--doux); font-size: 12.5px; }
  .synchro .fl { color: var(--doux); transition: transform .2s; flex: none; }
  .synchro.ouvert .fl { transform: rotate(180deg); }
  .details-synchro { display: none; border-top: 1px solid var(--trait); padding: 4px 12px 10px; }
  .synchro.ouvert .details-synchro { display: block; }
  .ag { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
  .ag + .ag { border-top: 1px solid var(--trait); }
  .ag .nom { font-weight: 600; flex: 1; }
  .ag .info { color: var(--doux); font-size: 12.5px; text-align: right; }
  .etat { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; flex: none; }
  .etat.ok { background: color-mix(in srgb, var(--vert) 16%, transparent); color: var(--vert); }
  .etat.partiel, .etat.ancien { background: rgba(217,154,43,.16); color: #b07812; }
  .etat.erreur, .etat.bloque { background: rgba(200,67,46,.14); color: #c8432e; }
  .note-synchro { color: var(--doux); font-size: 12.5px; margin-top: 6px; }

  /* Liste */
  .resume { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 4px; color: var(--doux); font-size: 14px; }
  .resume select { border: 0; background: none; color: var(--texte); font-weight: 600; text-align: right; padding: 4px 0; }
  main { padding: 4px 16px 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); max-width: 1100px; margin: 0 auto; }
  .carte { background: var(--carte); border-radius: 18px; overflow: hidden; box-shadow: var(--ombre); position: relative; }
  .carte a.lien { color: inherit; text-decoration: none; display: block; }
  .visuel { aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--accent-doux), color-mix(in srgb, var(--accent-doux) 60%, var(--fond)));
            display: grid; place-items: center; position: relative; overflow: hidden; }
  .visuel.sans { aspect-ratio: auto; height: 64px; }
  .visuel.sans .maisonnette svg { width: 30px; height: 30px; }
  .visuel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .visuel .maisonnette { color: var(--accent); opacity: .45; }
  .badges { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
  .badge { background: rgba(255,253,249,.94); color: #2a211b; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .badge.neuf { background: var(--accent); color: #fff; }
  .actions { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
  .rond { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,253,249,.94); color: #2a211b;
          display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .rond.fav-on { color: var(--accent); }
  .corps { padding: 12px 14px 14px; }
  .prix-ligne { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .prix { font-family: var(--titre); font-size: 25px; font-weight: 700; letter-spacing: -.01em; }
  .m2 { color: var(--doux); font-size: 13px; white-space: nowrap; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 14.5px; }
  .specs span { display: inline-flex; align-items: center; gap: 5px; }
  .specs svg { color: var(--doux); }
  .lieu { margin-top: 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .lieu .km { color: var(--doux); font-weight: 400; }
  .titre { color: var(--doux); font-size: 13.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pied { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .agence { font-size: 12.5px; font-weight: 600; background: var(--fond); border: 1px solid var(--trait); border-radius: 8px; padding: 3px 8px; text-decoration: none; color: inherit; }
  .date { margin-left: auto; color: var(--doux); font-size: 12.5px; }
  .badge.affaire { background: #2f7d4f; color: #fff; }
  .badge.cher { background: #c8432e; color: #fff; }
  .badge.unpeu { background: #d99a2b; color: #fff; }
  .marche { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--fond); border: 1px solid var(--trait); }
  .marche .haut-m { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .marche .verdict { font-weight: 700; }
  .marche.v-bonne-affaire .verdict { color: #2f7d4f; }
  .marche.v-un-peu-cher .verdict { color: #b07812; }
  .marche.v-trop-cher .verdict { color: #c8432e; }
  .marche.v-incertain .verdict { color: var(--doux); }
  .marche .detail { margin-left: auto; color: var(--accent); font-weight: 600; text-decoration: none; font-size: 13.5px; white-space: nowrap; }
  .jauge { position: relative; height: 8px; border-radius: 4px; margin: 12px 0 4px;
           background: linear-gradient(90deg, #2f7d4f 0%, #7fae5e 30%, #e3c25a 55%, #d98a3a 75%, #c8432e 100%); opacity: .9; }
  .jauge .zone { position: absolute; top: -3px; bottom: -3px; border: 2px solid var(--texte); border-radius: 6px; opacity: .55; }
  .jauge .curseur { position: absolute; top: -6px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--texte); box-shadow: 0 0 0 2px var(--carte); }
  .marche .bas-m { display: flex; justify-content: space-between; color: var(--doux); font-size: 12px; }
  .vide { grid-column: 1 / -1; text-align: center; color: var(--doux); padding: 48px 20px; }
  .vide h2 { font-family: var(--titre); color: var(--texte); font-size: 22px; margin: 12px 0 6px; }
  .vide button { margin-top: 14px; border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 600; }

  /* Onglets du bas */
  .onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; gap: 4px;
             background: color-mix(in srgb, var(--carte) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
             border-top: 1px solid var(--trait); padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
  .onglet { flex: 1; max-width: 160px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
            font-size: 11.5px; font-weight: 600; color: var(--doux); padding: 4px 0; }
  .onglet.on { color: var(--accent); }

  /* Panneau des filtres */
  .voile { position: fixed; inset: 0; background: rgba(20,12,6,.38); z-index: 9; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .voile.on { opacity: 1; pointer-events: auto; }
  .panneau { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--carte); border-radius: 22px 22px 0 0;
             max-height: 88vh; display: flex; flex-direction: column; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
             max-width: 640px; margin: 0 auto; }
  .panneau.on { transform: none; }
  .panneau header { padding: 10px 16px 8px; border-bottom: 1px solid var(--trait); text-align: center; position: relative; }
  .poignee { width: 38px; height: 5px; border-radius: 3px; background: var(--trait); margin: 0 auto 8px; }
  .panneau h2 { font-family: var(--titre); font-size: 20px; margin: 0; }
  .panneau header button { position: absolute; top: 18px; border: 0; background: none; color: var(--accent); font-weight: 600; }
  .contenu { overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
  .bloc { padding: 14px 0; border-bottom: 1px solid var(--trait); }
  .bloc:last-child { border-bottom: 0; }
  .bloc h3 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; }
  .bloc h3 small { color: var(--doux); font-weight: 400; }
  .duo { display: flex; gap: 10px; }
  .champ { flex: 1; display: flex; align-items: center; border: 1px solid var(--trait); border-radius: 12px; padding: 0 12px; background: var(--fond); }
  .champ input { width: 100%; border: 0; background: none; padding: 11px 0; outline: none; font-size: 16px; }
  .champ span { color: var(--doux); font-size: 14px; }
  .segments { display: flex; border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; background: var(--fond); }
  .segments button { flex: 1; border: 0; background: none; padding: 9px 0; font-weight: 600; font-size: 14.5px; }
  .segments button + button { border-left: 1px solid var(--trait); }
  .segments button.on { background: var(--texte); color: var(--fond); }
  .grille-puces { display: flex; flex-wrap: wrap; gap: 8px; }
  .interrupteur { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .interrupteur input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--trait); position: relative; transition: background .2s; flex: none; }
  .interrupteur input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .interrupteur input:checked { background: var(--vert); }
  .interrupteur input:checked::after { transform: translateX(20px); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .panneau footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--trait); }
  .panneau footer button { width: 100%; border: 0; background: var(--accent); color: #fff; font-weight: 700; padding: 14px; border-radius: 14px; font-size: 16px; }

  .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
           background: var(--texte); color: var(--fond); padding: 10px 14px; border-radius: 12px; font-size: 14px; z-index: 20;
           transition: all .25s; display: flex; gap: 12px; align-items: center; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: none; color: var(--accent-doux); font-weight: 700; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></symbol>
  <symbol id="i-bas" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-filtres" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-coeur" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
  <symbol id="i-coeur-plein" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
  <symbol id="i-masquer" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M7 7l10 10M17 7 7 17"/></symbol>
  <symbol id="i-surface" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 4h16v16H4zM4 9h5V4M15 20v-5h5"/></symbol>
  <symbol id="i-lit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5M7 11.5h0"/><circle cx="7" cy="11" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-pieces" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 20V10l8-6 8 6v10H4Zm6 0v-6h4v6"/></symbol>
  <symbol id="i-terrain" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 21v-7M12 14c-3 0-5-2-5-5a5 5 0 0 1 10 0c0 3-2 5-5 5ZM4 21h16"/></symbol>
  <symbol id="i-maison" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2 11.5h3V20h5v-5h4v5h5v-8.5h3L12 3Z"/></symbol>
  <symbol id="i-liste" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 6h12M8 12h12M8 18h12M4 6h0M4 12h0M4 18h0"/></symbol>
</svg>

<header class="haut">
  <div class="ligne-titre">
    <h1>Ma maison</h1>
  </div>
  <div class="barre">
    <label class="commune">
      <svg class="pin" width="18" height="18"><use href="#i-pin"/></svg>
      <select id="commune" aria-label="Commune"><option value="">Toutes les communes</option></select>
      <svg class="fleche" width="18" height="18"><use href="#i-bas"/></svg>
    </label>
    <button class="btn-filtres" id="ouvrirFiltres" aria-label="Filtres">
      <svg width="20" height="20"><use href="#i-filtres"/></svg>
      <span class="pastille" id="nbFiltres"></span>
    </button>
  </div>
  <div class="puces" id="puces">
    <button class="puce accent" data-rapide="neufs">Nouveautés</button>
    <button class="puce" data-rayon="5">5 km</button>
    <button class="puce" data-rayon="10">10 km</button>
    <button class="puce" data-rayon="15">15 km</button>
    <button class="puce" data-rayon="20">20 km</button>
    <button class="puce" data-rapide="b250">≤ 250 000 €</button>
    <button class="puce" data-rapide="b350">≤ 350 000 €</button>
    <button class="puce" data-rapide="ch3">3 ch. et +</button>
    <button class="puce" data-rapide="jardin">Terrain 500 m² +</button>
    <button class="puce accent" data-rapide="affaires">Bonnes affaires</button>
  </div>
</header>

<section class="synchro" id="synchro">
  <button id="synchroBtn" aria-expanded="false">
    <span class="point"></span>
    <span class="txt"><span class="l1" id="synchroL1">Chargement…</span><br><span class="l2" id="synchroL2"></span></span>
    <svg class="fl" width="18" height="18"><use href="#i-bas"/></svg>
  </button>
  <div class="details-synchro" id="synchroDetails"></div>
</section>

<div class="resume">
  <span id="compte"></span>
  <select id="tri" aria-label="Trier">
    <option value="recent">Plus récentes</option>
    <option value="prix-asc">Prix croissant</option>
    <option value="prix-desc">Prix décroissant</option>
    <option value="m2-asc">Prix au m² le plus bas</option>
    <option value="surface-desc">Plus grandes</option>
    <option value="terrain-desc">Plus grand terrain</option>
    <option value="distance">Plus proches de Donzère</option>
    <option value="affaire">Meilleures affaires (vs marché)</option>
  </select>
</div>

<main id="liste"></main>

<nav class="onglets">
  <button class="onglet on" data-vue="toutes"><svg width="24" height="24"><use href="#i-liste"/></svg>Annonces</button>
  <button class="onglet" data-vue="favoris"><svg width="24" height="24"><use href="#i-coeur"/></svg><span id="ongletFav">Favoris</span></button>
</nav>

<div class="voile" id="voile"></div>
<section class="panneau" id="panneau" aria-label="Filtres">
  <header>
    <div class="poignee"></div>
    <button id="reinit" style="left:16px">Effacer</button>
    <h2>Filtres</h2>
    <button id="fermer" style="right:16px">OK</button>
  </header>
  <div class="contenu">
    <div class="bloc">
      <h3>Budget</h3>
      <div class="duo">
        <label class="champ"><input id="prixMin" type="number" inputmode="numeric" placeholder="Min"><span>€</span></label>
        <label class="champ"><input id="prixMax" type="number" inputmode="numeric" placeholder="Max"><span>€</span></label>
      </div>
    </div>
    <div class="bloc">
      <h3>Distance de Donzère <small id="rayonTxt">toutes</small></h3>
      <input id="rayon" type="range" min="0" max="25" step="1" value="25" aria-label="Rayon en km">
    </div>
    <div class="bloc">
      <h3>Chambres</h3>
      <div class="segments" id="chambres">
        <button data-v="0">Tout</button><button data-v="1">1+</button><button data-v="2">2+</button><button data-v="3">3+</button><button data-v="4">4+</button><button data-v="5">5+</button>
      </div>
    </div>
    <div class="bloc">
      <h3>Surface et terrain</h3>
      <div class="duo">
        <label class="champ"><input id="surfaceMin" type="number" inputmode="numeric" placeholder="Surface min"><span>m²</span></label>
        <label class="champ"><input id="terrainMin" type="number" inputmode="numeric" placeholder="Terrain min"><span>m²</span></label>
      </div>
    </div>
    <div class="bloc">
      <h3>Type de bien</h3>
      <div class="grille-puces" id="types"></div>
    </div>
    <div class="bloc">
      <h3>Prix par rapport au marché <small>estimateur DVF</small></h3>
      <div class="segments" id="filtreMarche">
        <button data-v="">Tout</button><button data-v="max">Au marché ou moins</button><button data-v="affaire">Bonnes affaires</button>
      </div>
    </div>
    <div class="bloc">
      <h3>Agences</h3>
      <div class="grille-puces" id="agences"></div>
    </div>
    <div class="bloc">
      <label class="interrupteur">Nouveautés du jour seulement <input type="checkbox" id="neufs"></label>
      <label class="interrupteur">Masquer les annonces sans prix <input type="checkbox" id="avecPrix"></label>
      <label class="interrupteur">Regrouper les doublons entre agences <input type="checkbox" id="regrouper" checked></label>
      <label class="interrupteur">Afficher les annonces masquées <input type="checkbox" id="voirMasquees"></label>
    </div>
  </div>
  <footer><button id="voir">Voir les annonces</button></footer>
</section>

<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">Annuler</button></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const euros = n => n.toLocaleString("fr-FR") + " €";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = (id, t = 16) => `<svg width="${t}" height="${t}"><use href="#${id}"/></svg>`;

function lire(cle, defaut) { try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; } catch { return defaut; } }
function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch {} }

const FILTRES_VIDES = { commune: "", prixMin: "", prixMax: "", rayon: 25, chambres: 0, surfaceMin: "", terrainMin: "",
                        types: [], agences: [], neufs: false, avecPrix: false, marche: "", regrouper: true, voirMasquees: false, tri: "recent" };
let f = Object.assign({}, FILTRES_VIDES, lire("filtres-v2", {}));
let favoris = new Set(lire("favoris", []));
let masquees = new Set(lire("masquees", []));
let vue = "toutes";
let annonces = [];
let DONNEES = {};

/* ---------- Doublons : même commune, même prix, surface proche ---------- */
function regrouper(liste) {
  const groupes = new Map();
  for (const a of liste) {
    const cle = a.prix && a.surface ? `${a.commune}|${a.prix}|${Math.round(a.surface / 3)}` : a.ref;
    if (!groupes.has(cle)) groupes.set(cle, Object.assign({}, a, { autres: [] }));
    else {
      const g = groupes.get(cle);
      if (g.source !== a.source && !g.autres.some(o => o.source === a.source)) g.autres.push({ source: a.source, lien: a.lien });
      if (!g.photo && a.photo) g.photo = a.photo;
      if (!g.terrain && a.terrain) g.terrain = a.terrain;
      if (!g.marche && a.marche) g.marche = a.marche;
      if (a.vu_le < g.vu_le) g.vu_le = a.vu_le;
      g.nouveau = g.nouveau && a.nouveau;
    }
  }
  return [...groupes.values()];
}

/* ---------- Filtrage et tri ---------- */
function filtrer(ignorer) {
  return annonces.filter(a =>
    (ignorer === "commune" || !f.commune || a.commune === f.commune) &&
    (!f.prixMin || (a.prix && a.prix >= +f.prixMin)) &&
    (!f.prixMax || (a.prix && a.prix <= +f.prixMax)) &&
    (f.rayon >= 25 || (a.distance_km != null && a.distance_km <= f.rayon)) &&
    (!f.chambres || (a.chambres && a.chambres >= f.chambres)) &&
    (!f.surfaceMin || (a.surface && a.surface >= +f.surfaceMin)) &&
    (!f.terrainMin || (a.terrain && a.terrain >= +f.terrainMin)) &&
    (!f.types.length || f.types.includes(a.type)) &&
    (!f.agences.length || f.agences.includes(a.source)) &&
    (!f.neufs || a.nouveau) &&
    (!f.avecPrix || a.prix) &&
    (!f.marche || (a.marche && (f.marche === "affaire" ? a.marche.verdict === "bonne-affaire"
                             : f.marche === "max" ? a.marche.ecart <= 0.10 && a.marche.verdict !== "incertain" : true))) &&
    (f.voirMasquees || !masquees.has(a.ref)) &&
    (vue !== "favoris" || favoris.has(a.ref)));
}
const TRIS = {
  "recent": (a, b) => (b.vu_le || "").localeCompare(a.vu_le || "") || (a.distance_km ?? 99) - (b.distance_km ?? 99),
  "prix-asc": (a, b) => (a.prix || 9e9) - (b.prix || 9e9),
  "prix-desc": (a, b) => (b.prix || 0) - (a.prix || 0),
  "m2-asc": (a, b) => (a.prix_m2 || 9e9) - (b.prix_m2 || 9e9),
  "surface-desc": (a, b) => (b.surface || 0) - (a.surface || 0),
  "terrain-desc": (a, b) => (b.terrain || 0) - (a.terrain || 0),
  "distance": (a, b) => (a.distance_km ?? 99) - (b.distance_km ?? 99),
  "affaire": (a, b) => (a.marche ? a.marche.ecart : 9) - (b.marche ? b.marche.ecart : 9),
};

function nbFiltresActifs() {
  return ["prixMin", "prixMax", "surfaceMin", "terrainMin"].filter(k => f[k]).length
    + (f.rayon < 25) + (f.chambres > 0) + (f.types.length > 0) + (f.agences.length > 0)
    + f.neufs + f.avecPrix + f.voirMasquees + (f.marche !== "");
}

/* ---------- Affichage ---------- */
function dateCourte(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00"), auj = new Date();
  const jours = Math.round((new Date(auj.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (jours <= 0) return "Aujourd'hui";
  if (jours === 1) return "Hier";
  if (jours < 7) return `Il y a ${jours} jours`;
  return "Depuis le " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

const VERDICTS = {
  "bonne-affaire": "Bonne affaire",
  "marche": "Prix du marché",
  "un-peu-cher": "Un peu cher",
  "trop-cher": "Trop cher",
  "incertain": "Estimation peu fiable",
};
function blocMarche(a) {
  const m = a.marche;
  if (!m) return "";
  const k = n => Math.round(n / 1000).toLocaleString("fr-FR") + " k€";
  // jauge de bas×0,8 à haut×1,3 (frais d'agence compris) ; la zone encadrée = fourchette du marché
  const f = 1 + (DONNEES.marche?.frais_agence ?? 0.05);
  const lo = m.bas * f * 0.8, hi = m.haut * f * 1.3, pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const ecart = `${m.ecart > 0 ? "+" : "−"}${Math.abs(Math.round(m.ecart * 100))} %`;
  return `<div class="marche v-${m.verdict}">
    <div class="haut-m"><span class="verdict">${VERDICTS[m.verdict]}</span><span style="white-space:nowrap">${m.verdict === "incertain" ? `<span style="opacity:.7">écart ${ecart}, indicatif</span>` : ecart + " vs marché"}</span>
      <a class="detail" href="${esc(m.lien)}" target="_blank" rel="noopener">Estimation ›</a></div>
    <div class="jauge" aria-hidden="true">
      <span class="zone" style="left:${pos(m.bas * f)}%;right:${100 - pos(m.haut * f)}%"></span>
      <span class="curseur" style="left:${pos(a.prix)}%"></span>
    </div>
    <div class="bas-m"><span>Marché ${k(m.bas * f)} – ${k(m.haut * f)}</span><span>${m.ventes} ventes · fiabilité ${m.fiabilite}/100</span></div>
  </div>`;
}

function carte(a) {
  const fav = favoris.has(a.ref);
  const specs = [
    a.surface && `<span>${ico("i-surface")}${a.surface} m²</span>`,
    a.pieces && `<span>${ico("i-pieces")}${a.pieces} p.</span>`,
    a.chambres && `<span>${ico("i-lit")}${a.chambres} ch.</span>`,
    a.terrain && `<span>${ico("i-terrain")}${a.terrain.toLocaleString("fr-FR")} m²</span>`,
  ].filter(Boolean).join("");
  const m = a.marche;
  const pct = m ? `${m.ecart > 0 ? "+" : "−"}${Math.abs(Math.round(m.ecart * 100))} %` : "";
  const badgeMarche = !m ? "" : {
    "bonne-affaire": `<span class="badge affaire">Bonne affaire ${pct}</span>`,
    "un-peu-cher": `<span class="badge unpeu">Un peu cher ${pct}</span>`,
    "trop-cher": `<span class="badge cher">Trop cher ${pct}</span>`,
  }[m.verdict] || "";
  const badges = [
    a.nouveau && `<span class="badge neuf">Nouveau</span>`,
    badgeMarche,
    a.type && a.type !== "Maison" && `<span class="badge">${esc(a.type)}</span>`,
  ].filter(Boolean).join("");
  const visuel = a.photo
    ? `<img src="${esc(a.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'maisonnette',innerHTML:'${ico("i-maison", 56).replace(/"/g, "&quot;")}'}))">`
    : `<div class="maisonnette">${ico("i-maison", 56)}</div>`;
  const autres = (a.autres || []).map(o => `<a class="agence" href="${esc(o.lien)}" target="_blank" rel="noopener">${esc(o.source)}</a>`).join("");
  return `<article class="carte">
    <a class="lien" href="${esc(a.lien)}" target="_blank" rel="noopener">
      <div class="visuel${a.photo ? "" : " sans"}">${visuel}<div class="badges">${badges}</div></div>
      <div class="corps">
        <div class="prix-ligne">
          <span class="prix">${a.prix ? euros(a.prix) : "Prix sur demande"}</span>
          ${a.prix_m2 ? `<span class="m2">${a.prix_m2.toLocaleString("fr-FR")} €/m²</span>` : ""}
        </div>
        ${specs ? `<div class="specs">${specs}</div>` : ""}
        <div class="lieu">${ico("i-pin", 15)}${esc(a.commune)}${a.distance_km != null && a.distance_km > 0 ? `<span class="km">· ${String(a.distance_km).replace(".", ",")} km</span>` : ""}</div>
        <div class="titre">${esc(String(a.titre || "").replace(/\bm 2\b/g, "m²").replace(/^Achat /, ""))}</div>
      </div>
    </a>
    <div class="corps" style="padding-top:0">${blocMarche(a)}<div class="pied">
      <a class="agence" href="${esc(a.lien)}" target="_blank" rel="noopener">${esc(a.agence ? `${a.agence} · via ${a.source}` : a.source)}</a>${autres}
      <span class="date">${dateCourte(a.vu_le)}</span>
    </div></div>
    <div class="actions">
      <button class="rond" data-masquer="${esc(a.ref)}" aria-label="${masquees.has(a.ref) ? "Réafficher" : "Masquer"}">${ico("i-masquer", 18)}</button>
      <button class="rond ${fav ? "fav-on" : ""}" data-fav="${esc(a.ref)}" aria-label="Favori">${ico(fav ? "i-coeur-plein" : "i-coeur", 20)}</button>
    </div>
  </article>`;
}

function remplirCommunes() {
  const comptes = new Map();
  for (const a of filtrer("commune")) comptes.set(a.commune, (comptes.get(a.commune) || 0) + 1);
  const toutes = [...new Map(annonces.map(a => [a.commune, a.distance_km])).entries()]
    .sort((x, y) => (x[1] ?? 99) - (y[1] ?? 99) || x[0].localeCompare(y[0]));
  const total = [...comptes.values()].reduce((s, n) => s + n, 0);
  $("commune").innerHTML = `<option value="">Toutes les communes (${total})</option>` + toutes.map(([c, km]) =>
    `<option value="${esc(c)}">${esc(c)}${km != null && km > 0 ? ` · ${Math.round(km)} km` : ""} (${comptes.get(c) || 0})</option>`).join("");
  $("commune").value = f.commune;
}

function afficher() {
  ecrire("filtres-v2", f);
  let liste = filtrer();
  if (f.regrouper) liste = regrouper(liste);
  liste.sort(TRIS[f.tri] || TRIS.recent);
  remplirCommunes();
  const nb = nbFiltresActifs();
  $("nbFiltres").textContent = nb; $("nbFiltres").classList.toggle("on", nb > 0);
  $("compte").textContent = `${liste.length} annonce${liste.length > 1 ? "s" : ""}`;
  $("voir").textContent = `Voir ${liste.length} annonce${liste.length > 1 ? "s" : ""}`;
  $("ongletFav").textContent = favoris.size ? `Favoris (${favoris.size})` : "Favoris";
  $("tri").value = f.tri;
  majPuces();
  $("liste").innerHTML = liste.map(carte).join("") || (vue === "favoris"
    ? `<div class="vide">${ico("i-coeur", 44)}<h2>Pas encore de favoris</h2>Touche le cœur d'une annonce pour la garder ici.</div>`
    : `<div class="vide">${ico("i-maison", 44)}<h2>Aucune annonce</h2>Aucun bien ne correspond à ces critères.<br><button id="toutEffacer">Effacer les filtres</button></div>`);
  const b = $("toutEffacer"); if (b) b.onclick = () => { f = Object.assign({}, FILTRES_VIDES, { tri: f.tri }); syncPanneau(); afficher(); };
}

/* ---------- Puces rapides ---------- */
const RAPIDES = {
  neufs: { actif: () => f.neufs, basculer: v => f.neufs = v },
  b250: { actif: () => f.prixMax == 250000, basculer: v => f.prixMax = v ? 250000 : "" },
  b350: { actif: () => f.prixMax == 350000, basculer: v => f.prixMax = v ? 350000 : "" },
  ch3: { actif: () => f.chambres === 3, basculer: v => f.chambres = v ? 3 : 0 },
  jardin: { actif: () => f.terrainMin == 500, basculer: v => f.terrainMin = v ? 500 : "" },
  affaires: { actif: () => f.marche === "affaire", basculer: v => f.marche = v ? "affaire" : "" },
};
function majPuces() {
  document.querySelectorAll("[data-rayon]").forEach(p => p.classList.toggle("on", +p.dataset.rayon === f.rayon));
  document.querySelectorAll("[data-rapide]").forEach(p => p.classList.toggle("on", RAPIDES[p.dataset.rapide].actif()));
}
$("puces").addEventListener("click", e => {
  const p = e.target.closest(".puce"); if (!p) return;
  if (p.dataset.rayon) f.rayon = f.rayon === +p.dataset.rayon ? 25 : +p.dataset.rayon;
  else { const r = RAPIDES[p.dataset.rapide]; r.basculer(!r.actif()); }
  syncPanneau(); afficher();
});

/* ---------- Panneau des filtres ---------- */
function puces(conteneur, valeurs, cle) {
  $(conteneur).innerHTML = valeurs.map(v => `<button class="puce ${f[cle].includes(v) ? "on" : ""}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
}
function syncPanneau() {
  for (const k of ["prixMin", "prixMax", "surfaceMin", "terrainMin"]) $(k).value = f[k];
  for (const k of ["neufs", "avecPrix", "regrouper", "voirMasquees"]) $(k).checked = f[k];
  $("rayon").value = f.rayon;
  $("rayonTxt").textContent = f.rayon >= 25 ? "toutes" : `jusqu'à ${f.rayon} km`;
  document.querySelectorAll("#chambres button").forEach(b => b.classList.toggle("on", +b.dataset.v === f.chambres));
  document.querySelectorAll("#filtreMarche button").forEach(b => b.classList.toggle("on", b.dataset.v === f.marche));
  puces("types", [...new Set(annonces.map(a => a.type))].sort(), "types");
  puces("agences", [...new Set(annonces.map(a => a.source))].sort(), "agences");
}
function ouvrir(on) { $("panneau").classList.toggle("on", on); $("voile").classList.toggle("on", on); }
$("ouvrirFiltres").onclick = () => { syncPanneau(); ouvrir(true); };
$("fermer").onclick = $("voir").onclick = $("voile").onclick = () => ouvrir(false);
$("reinit").onclick = () => { f = Object.assign({}, FILTRES_VIDES, { commune: f.commune, tri: f.tri }); syncPanneau(); afficher(); };
for (const k of ["prixMin", "prixMax", "surfaceMin", "terrainMin"]) $(k).addEventListener("input", e => { f[k] = e.target.value; afficher(); });
for (const k of ["neufs", "avecPrix", "regrouper", "voirMasquees"]) $(k).addEventListener("change", e => { f[k] = e.target.checked; afficher(); });
$("rayon").addEventListener("input", e => { f.rayon = +e.target.value; syncPanneau(); afficher(); });
$("filtreMarche").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; f.marche = b.dataset.v; syncPanneau(); afficher(); });
$("chambres").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; f.chambres = +b.dataset.v; syncPanneau(); afficher(); });
for (const [id, cle] of [["types", "types"], ["agences", "agences"]]) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const v = b.dataset.v; f[cle] = f[cle].includes(v) ? f[cle].filter(x => x !== v) : [...f[cle], v];
    syncPanneau(); afficher();
  });
}
$("commune").addEventListener("change", e => { f.commune = e.target.value; afficher(); window.scrollTo({ top: 0 }); });
$("tri").addEventListener("change", e => { f.tri = e.target.value; afficher(); });

/* ---------- Favoris, masquer, onglets ---------- */
let annuler = null, minuteur = null;
function toast(txt, action) {
  $("toastTxt").textContent = txt; annuler = action;
  $("toast").classList.add("on"); clearTimeout(minuteur);
  minuteur = setTimeout(() => $("toast").classList.remove("on"), 3500);
}
$("toastBtn").onclick = () => { if (annuler) annuler(); $("toast").classList.remove("on"); };
$("liste").addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]"), msq = e.target.closest("[data-masquer]");
  if (fav) {
    const r = fav.dataset.fav; favoris.has(r) ? favoris.delete(r) : favoris.add(r);
    ecrire("favoris", [...favoris]); afficher();
  } else if (msq) {
    const r = msq.dataset.masquer;
    if (masquees.has(r)) { masquees.delete(r); ecrire("masquees", [...masquees]); afficher(); return; }
    masquees.add(r); ecrire("masquees", [...masquees]); afficher();
    toast("Annonce masquée", () => { masquees.delete(r); ecrire("masquees", [...masquees]); afficher(); });
  }
});
document.querySelector(".onglets").addEventListener("click", e => {
  const o = e.target.closest(".onglet"); if (!o) return;
  vue = o.dataset.vue;
  document.querySelectorAll(".onglet").forEach(x => x.classList.toggle("on", x === o));
  afficher(); window.scrollTo({ top: 0 });
});

/* ---------- Bandeau de synchronisation ---------- */
function versDate(iso) {
  if (!iso) return null;
  const s = /[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z";  // anciennes heures écrites en UTC sans fuseau
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function quand(d) {
  const maint = new Date(), min = Math.round((maint - d) / 6e4);
  const heure = `${d.getHours()} h ${String(d.getMinutes()).padStart(2, "0")}`;
  const jours = Math.round((new Date(maint.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  if (jours === 0) return `aujourd'hui à ${heure}`;
  if (jours === 1) return `hier à ${heure}`;
  return `le ${d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" })} à ${heure}`;
}
function ligneMarche(data) {
  const m = data.marche;
  if (!m) return `<div class="ag"><span class="nom">Estimateur DVF</span><span class="info">pas encore calculé</span><span class="etat ancien">—</span></div>`;
  const dv = m.derniere_vente ? ` · ventes jusqu'au ${new Date(m.derniere_vente).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" })}` : "";
  return `<div class="ag"><span class="nom">Estimateur DVF</span><span class="info">${m.statut === "ok" ? `${m.estimees} annonces estimées${dv}` : esc(m.message || "")}</span><span class="etat ${m.statut === "ok" ? "ok" : "erreur"}">${m.statut === "ok" ? "OK" : "Erreur"}</span></div>`;
}
function bandeau(data) {
  const d = versDate(data.mis_a_jour);
  const sources = data.sources || {};
  const noms = [...new Set([...Object.keys(sources), ...annonces.map(a => a.source)])].sort((a, b) => a.localeCompare(b));
  const heures = d ? (Date.now() - d) / 36e5 : Infinity;
  const enPanne = noms.filter(n => sources[n] && ["erreur", "bloqué"].includes(sources[n].statut));
  const nouvelles = annonces.filter(a => a.nouveau).length;
  const el = $("synchro");
  el.classList.toggle("alerte", heures > 26 || enPanne.length > 0);
  el.classList.toggle("panne", heures > 50);
  $("synchroL1").textContent = d ? `Synchronisé ${quand(d)}` : "Jamais synchronisé";
  $("synchroL2").textContent = heures > 26
    ? `Pas de nouvelle synchro depuis ${Math.floor(heures / 24)} jour${heures >= 48 ? "s" : ""} : le robot est peut-être arrêté`
    : `${annonces.length} annonces · ${nouvelles} nouvelle${nouvelles > 1 ? "s" : ""} · ${noms.length - enPanne.length}/${noms.length} agences OK`;
  const libelles = { ok: "OK", partiel: "Partiel", erreur: "Erreur", "bloqué": "Bloqué", ancien: "Ancien" };
  $("synchroDetails").innerHTML = noms.map(n => {
    const s = sources[n] || { statut: "ancien" };
    const nb = annonces.filter(a => a.source === n).length;
    const ok = versDate(s.reussi);
    const statut = s.statut === "bloqué" ? "bloque" : s.statut;
    const info = ["ok", "partiel"].includes(s.statut)
      ? `${nb} annonce${nb > 1 ? "s" : ""}${s.nouvelles ? ` · ${s.nouvelles} nouv.` : ""}${s.statut === "partiel" && s.message ? ` · ${esc(s.message)}` : ""}`
      : esc(s.message || (ok ? `dernière réussite ${quand(ok)}` : "pas encore suivi"));
    return `<div class="ag"><span class="nom">${esc(n)}</span><span class="info">${info}</span><span class="etat ${statut}">${libelles[s.statut] || "?"}</span></div>`;
  }).join("") + ligneMarche(data) + `<div class="note-synchro">Le robot passe chaque matin vers 7 h (8 h en été). Les agences bloquées gardent leurs dernières annonces.</div>
    <div class="note-synchro">Prix du marché : calculé par ton Estimateur DVF à partir des ventes notariées autour du centre de la commune, pour une maison en bon état de même surface, et majoré de ${Math.round((data.marche?.frais_agence ?? 0.05) * 100)} % de frais d'agence pour être comparable au prix affiché. Sous 20/100 de fiabilité, aucun verdict n'est donné (Estimation peu fiable). Bonne affaire = moins cher que les trois quarts des ventes comparables ; Prix du marché = dans la fourchette ; Un peu cher = jusqu'à 15 % au-dessus ; Trop cher = au-delà.</div>`;
}
$("synchroBtn").onclick = () => {
  const o = $("synchro").classList.toggle("ouvert");
  $("synchroBtn").setAttribute("aria-expanded", o);
};

/* ---------- Chargement ---------- */
fetch("data/annonces.json?" + Date.now()).then(r => r.json()).then(data => {
  DONNEES = data;
  annonces = (data.annonces || []).map(a => Object.assign({ commune: "Secteur non précisé", type: "Maison" }, a));
  if (f.commune && !annonces.some(a => a.commune === f.commune)) f.commune = "";
  syncPanneau(); afficher(); bandeau(data);
}).catch(() => {
  $("synchroL1").textContent = "Impossible de charger les annonces";
  $("liste").innerHTML = `<div class="vide">${ico("i-maison", 44)}<h2>Impossible de charger</h2>Vérifie ta connexion puis rouvre l'appli.</div>`;
});
</script>
</body>
